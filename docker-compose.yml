services:
  db:
    image: postgres:15-bookworm
    environment:
      POSTGRES_USER: node
      POSTGRES_PASSWORD: node
      POSTGRES_DB: runway
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U node -d runway"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://node:node@db:5432/runway?sslmode=disable"
      SCHEMA_PATH: /app/internal/store/schema.sql
      SEED_PATH: /app/internal/store/seed.sql
      RUN_MIGRATIONS: "1"
    ports:
      - "8080:8080"

volumes:
  pgdata:
